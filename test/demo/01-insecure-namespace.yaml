apiVersion: v1
kind: Namespace
metadata:
  name: kubeguardian-demo
---
apiVersion: security.kubeguardian.io/v1alpha1
kind: NamespaceSecurityReport
metadata:
  name: kubeguardian-demo
  namespace: kubeguardian-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: kubeguardian-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-api
  template:
    metadata:
      labels:
        app: legacy-api
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: api
          image: busybox
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: legacy-api
  namespace: kubeguardian-demo
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
