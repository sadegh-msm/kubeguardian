apiVersion: security.kubeguardian.io/v1alpha1
kind: SecurityCheck
metadata:
  name: kg012-default-service-account-token
spec:
  id: KG-012
  severity: Medium
  category: RBAC
  reference: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  scope: ServiceAccount
  bindings:
    users: >-
      workloads.filter(w,
        (w.spec.serviceAccountName == '' || w.spec.serviceAccountName == 'default') &&
        (!has(w.spec.automountServiceAccountToken) || w.spec.automountServiceAccountToken)
      ).map(w, w.kind + '/' + w.name)
  violation: >-
    serviceAccount.metadata.name == 'default' &&
    users.size() > 0 &&
    !(has(serviceAccount.automountServiceAccountToken) &&
      !serviceAccount.automountServiceAccountToken)
  message: >-
    the default ServiceAccount automounts an API token into ${users.size()} workload(s)
    (${users[0]}) that do not appear to need API access
  suggestion: >-
    Disable automounting on the default ServiceAccount, and give workloads that do call the
    API their own ServiceAccount with a scoped Role.
  remediation: >-
    kubectl patch serviceaccount default -n ${namespaceObject.metadata.name}
    -p '{"automountServiceAccountToken":false}'
