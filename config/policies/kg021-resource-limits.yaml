apiVersion: security.kubeguardian.io/v1alpha1
kind: SecurityCheck
metadata:
  name: kg021-resource-limits
spec:
  id: KG-021
  severity: Medium
  category: Governance
  reference: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  scope: Container
  bindings:
    # A quantity of zero is not a limit. Testing presence alone would pass a
    # container that sets every field to "0", which is how one on this cluster
    # was written.
    missing: >-
      [ 'memory' in limits   && quantity(limits['memory']).isGreaterThan(quantity('0'))   ? '' : 'memory limit',
        'cpu'    in requests && quantity(requests['cpu']).isGreaterThan(quantity('0'))    ? '' : 'cpu request',
        'memory' in requests && quantity(requests['memory']).isGreaterThan(quantity('0')) ? '' : 'memory request'
      ].filter(f, f != '')
  violation: missing.size() > 0
  message: >-
    container "${container.name}" is missing ${joinFields(missing)}, so it can starve
    neighbours on the node and makes the namespace a denial-of-service vector
  suggestion: >-
    Set both requests and limits. Requests drive scheduling and limits cap the blast radius
    of a runaway process.
  remediation: >-
    kubectl patch ${workload.kind.lowerAscii()} ${workload.name} -n
    ${namespaceObject.metadata.name} --type=json
    -p='[{"op":"replace","path":"/spec/template/spec/containers/${containerIndex}/resources","value":{"requests":{"cpu":"100m","memory":"128Mi"},"limits":{"memory":"512Mi"}}}]'
