---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: securitychecks.security.kubeguardian.io
spec:
  group: security.kubeguardian.io
  names:
    kind: SecurityCheck
    listKind: SecurityCheckList
    plural: securitychecks
    shortNames:
    - seccheck
    singular: securitycheck
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.id
      name: ID
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecurityCheck is the Schema for the securitychecks API.
          It defines one manifest check as CEL expressions, so adding or changing a rule
          is a manifest rather than a code change.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SecurityCheckSpec defines a check as expressions rather than as Go code.

              Every expression is CEL, the same language Kubernetes uses for
              ValidatingAdmissionPolicy and CRD validation rules. Which variables are in
              scope depends on spec.scope; see the README for the table.
            properties:
              bindings:
                additionalProperties:
                  type: string
                description: |-
                  Bindings are named expressions evaluated before everything else and
                  visible to violation and to the three message fields. Use them when a
                  message has to name which of several conditions failed.
                type: object
              category:
                enum:
                - PodSecurity
                - Network
                - RBAC
                - SupplyChain
                - Governance
                type: string
              id:
                description: |-
                  ID is the finding identifier this check produces, such as KG-007. A
                  ScanException matches on it, so changing it changes which exceptions apply.
                minLength: 1
                type: string
              message:
                description: |-
                  Message states what is wrong with this specific subject. Text inside
                  ${...} is CEL and everything else is literal, so a YAML block keeps its
                  formatting.
                minLength: 1
                type: string
              reference:
                description: Reference is a documentation URL recorded on every finding.
                type: string
              remediation:
                description: Remediation is a command or manifest that applies the
                  fix.
                minLength: 1
                type: string
              scope:
                description: |-
                  Scope is the subject a check is evaluated against. It decides which variables
                  the expressions can name and how many findings one check can produce.
                enum:
                - Namespace
                - Workload
                - Container
                - Role
                - ServiceAccount
                type: string
              severity:
                enum:
                - Critical
                - High
                - Medium
                - Low
                type: string
              suggestion:
                description: Suggestion states what to do about it, in prose.
                minLength: 1
                type: string
              violation:
                description: |-
                  Violation must evaluate to a boolean. True means the subject has the
                  problem this check describes.
                minLength: 1
                type: string
            required:
            - category
            - id
            - message
            - remediation
            - scope
            - severity
            - suggestion
            - violation
            type: object
          status:
            description: |-
              SecurityCheckStatus reports whether the expressions compile. A check that does
              not compile produces no findings, and this is where that is visible.
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the SecurityCheck resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
