---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - limitranges
  - namespaces
  - resourcequotas
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - aquasecurity.github.io
  resources:
  - exposedsecretreports
  - vulnerabilityreports
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.kubeguardian.io
  resources:
  - imagesecurityreports
  - manifestsecurityreports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.kubeguardian.io
  resources:
  - imagesecurityreports/finalizers
  - manifestsecurityreports/finalizers
  verbs:
  - update
- apiGroups:
  - security.kubeguardian.io
  resources:
  - imagesecurityreports/status
  - manifestsecurityreports/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - security.kubeguardian.io
  resources:
  - scanexceptions
  verbs:
  - get
  - list
  - watch
