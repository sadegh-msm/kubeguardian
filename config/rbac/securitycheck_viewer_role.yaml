# This rule is not used by the project kubeguardian itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to security.kubeguardian.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeguardian
    app.kubernetes.io/managed-by: kustomize
  name: securitycheck-viewer-role
rules:
- apiGroups:
  - security.kubeguardian.io
  resources:
  - securitychecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.kubeguardian.io
  resources:
  - securitychecks/status
  verbs:
  - get
